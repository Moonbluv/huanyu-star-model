<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>环域写实原型</title>
<style>
:root{--bg:#0b0d10;--fg:#d9dde3;--mut:#8a929c;--line:#262b33;--acc:#c9a86a}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:12.5px/1.5 system-ui,"Microsoft YaHei",sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#ui{position:fixed;left:10px;top:10px;width:270px;max-height:calc(100% - 20px);overflow:auto;background:rgba(11,13,16,.84);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
#ui h1{font-size:13px;margin:0 0 6px;color:var(--acc);font-weight:600}
#ui label{display:flex;justify-content:space-between;gap:6px;margin:4px 0;color:var(--mut)}
#ui label span{color:var(--fg);font-variant-numeric:tabular-nums}
#ui input[type=range]{width:100%;margin:0}
#ui select,#ui button{background:#151920;color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:2px 6px;font:inherit}
#ui .row{display:flex;gap:6px;flex-wrap:wrap;margin:5px 0}
#hud{position:fixed;right:10px;bottom:10px;background:rgba(11,13,16,.8);border:1px solid var(--line);border-radius:6px;padding:6px 9px;color:var(--mut);font-variant-numeric:tabular-nums;white-space:pre;max-width:60vw}
#err{position:fixed;inset:auto 10px 10px auto;color:#f88}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="glsl_common.js"></script>
<script src="glsl_passes.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>环域 · 生活其中的人看到的样子（原型）</h1>
  <div class="row"><select id="site"></select><select id="mode"><option value="1">阶地＋峭壁</option><option value="0">顺球面斜坡</option></select></div>
  <label>年内第几日 <span id="oDay"></span></label><input id="day" type="range" min="0" max="359" step="1">
  <label>当地时刻 <span id="oHour"></span></label><input id="hour" type="range" min="0" max="24" step="0.05">
  <label>流速 <span id="oSpd"></span></label><input id="spd" type="range" min="0" max="5" step="1">
  <label>标高 H <span id="oH"></span></label><input id="H" type="range" min="4" max="60" step="1">
  <label>近地能见度 V <span id="oV"></span></label><input id="V" type="range" min="20" max="600" step="10">
  <label>阶地宽 w <span id="oW"></span></label><input id="W" type="range" min="0.5" max="8" step="0.1">
  <label>云量 <span id="oCov"></span></label><input id="cov" type="range" min="0" max="1" step="0.05">
  <label>曝光补偿 EV <span id="oEv"></span></label><input id="ev" type="range" min="-3" max="3" step="0.25">
  <label>画质 <select id="q"><option value="0">低</option><option value="1" selected>中</option><option value="2">高</option></select></label>
  <div class="row"><button data-look="N">北</button><button data-look="E">东</button><button data-look="S">南</button><button data-look="W">西</button><button data-look="Z">天顶</button><button data-look="sun">太阳</button><button data-look="moon">月</button></div>
  <div class="row"><label style="margin:0"><input type="checkbox" id="clouds" checked> 云</label><label style="margin:0"><input type="checkbox" id="zuiyu" checked> 罪域阴云</label></div>
</div>
<div id="hud"></div>
<div id="err"></div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const R = 6371, A_T = 600, TAU = Math.PI*2, D2R = Math.PI/180;

const SKY = {rs:640, rm:R/2, Amp:R/2, Y:360, M:32, rhoS:20, rhoM:90, E0:127, D0:R-640};

const SITES = [['圣禁城',3600,0],['伊美忒',4000,2],['涅赫莱恩',5600,30],['罪域·啜泣堡',6670,-4],['灵薄带',9500,0]];
const S = {site:3, mode:1, day:300, hour:15.5, spd:0, H:40, V:200, W:2.0, cov:0.45, ev:0, q:1, clouds:true, zuiyu:true, yaw:180, pitch:20, fov:60, year:0, stand:0.6};

/* ---------- 噪声体纹理（64³ RGBA8，可平铺）：R＝值噪声 fbm，G＝反 Worley，B/A＝单频值噪声 ---------- */

const canvas = $('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:false, powerPreference:'high-performance'});

renderer.autoClear = false;
const gl = renderer.getContext();
const dbg = gl.getExtension('WEBGL_debug_renderer_info'); const GPU = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : '?';

const probeRT = RT(32, 48, NEAREST);
const shRT = [RT(9, 3, NEAREST), RT(9, 3, NEAREST)];
const meterRT = RT(64, 32, NEAREST);
const expRT = [RT(1, 1, NEAREST), RT(1, 1, NEAREST)];
let farRT, nearRT, hdrRT, bloomA, bloomB;

  uR:{value:R}, uA:{value:A_T}, uZtop:{value:320}, uBetaR:{value:new THREE.Vector3()}, uBetaMs:{value:new THREE.Vector3()}, uBetaMa:{value:new THREE.Vector3()},
  uHR:{value:40}, uHM:{value:8}, uMieG:{value:0.76},
  uTauLUT:{value:tauRT.texture}, uTauSize:{value:new THREE.Vector2(256,128)}, uMsLUT:{value:msRT.texture}, uMsSize:{value:new THREE.Vector2(32,32)},
  uSH:{value:shRT[0].texture}, uExpTex:{value:expRT[0].texture}, uNoise3:{value:noiseTex},
  uSunW:{value:new THREE.Vector3()}, uSunRho:{value:SKY.rhoS}, uSunE0:{value:new THREE.Vector3(SKY.E0, SKY.E0, SKY.E0)}, uSunD0:{value:SKY.D0},
  uMoonW:{value:new THREE.Vector3()}, uMoonRho:{value:SKY.rhoM}, uMoonAlb:{value:0.12},
  uCamW:{value:new THREE.Vector3()}, uCamK:{value:0}, uCamZ:{value:0}, uInvVP:{value:new THREE.Matrix4()}, uCM2W:{value:new THREE.Matrix3()},
  uTime:{value:0}, uGroundAlb:{value:0.15}, uTowerAlb:{value:0.004},
  uStairOn:{value:1}, uStairD:{value:0.001}, uTerrAmp:{value:0.25},
  uCloudOn:{value:1}, uCloudB:{value:1.5}, uCloudT:{value:4.0}, uCloudSig:{value:30}, uCloudCov:{value:0.45},
  uZuiyuN:{value:new THREE.Vector3()}, uZuiyuOvc:{value:1}, uAbyssHalf:{value:1.0},
};
const fsCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1); const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2)); const fsScene = new THREE.Scene(); fsScene.add(quad); quad.frustumCulled = false;

const M = {
  tau: mat(PASSES.tau), ms: mat(PASSES.ms), probe: mat(PASSES.probe), sh: mat(PASSES.sh, {tProbe:{value:probeRT.texture}}),
  far: mat(PASSES.far, {uMeshR:{value:12}, uHmax:{value:2}, uReliefN:{value:48}, uFarN:{value:8}}),
  near: mat(PASSES.near, {tFar:{value:null}, uNearN:{value:16}, uCloudN:{value:16}, uJit:{value:0.5}}),
  comp: mat(PASSES.composite, {tFar:{value:null}, tNear:{value:null}, uLowSize:{value:new THREE.Vector2()}, uPix:{value:new THREE.Vector2()}}),
  meter: mat(PASSES.meter, {tHDR:{value:null}}),
  adapt: mat(PASSES.adapt, {tMeter:{value:meterRT.texture}, tNear:{value:null}, uDt:{value:0.016}, uEvBias:{value:0}, uSunUV:{value:new THREE.Vector2()}, uSunEye:{value:0}}),
  down: mat(PASSES.bloomDown, {tSrc:{value:null}, uTexel:{value:new THREE.Vector2()}}),
  blur: mat(PASSES.blur, {tSrc:{value:null}, uDir:{value:new THREE.Vector2()}}),
  tone: mat(PASSES.tonemap, {tHDR:{value:null}, tBloom:{value:null}, tExpNew:{value:null}, uBloom:{value:0.04}, uGlare:{value:0.6}, uSunDir:{value:new THREE.Vector3()}}),
};
const GRIDN = 192;
const terrUni = {uPsiG:{value:0}, uRG:{value:1}, uCamOff:{value:new THREE.Vector3()}, uStairF0:{value:0}, uStairK0:{value:0}, uMeshR:{value:12}, uMeshD0:{value:0.004}, uLogFC:{value:1}, uG:{value:new THREE.Vector3()}};
const terrMat = new THREE.ShaderMaterial({glslVersion:THREE.GLSL3, defines:{GRIDN}, uniforms:Object.assign({}, U, terrUni), vertexShader:PASSES.terrainV, fragmentShader:PASSES.terrainF});

let W = 1, H = 1, LW = 1, LH = 1;
function resize() {
  const q = Q[S.q]; const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  const cw = canvas.clientWidth, ch = canvas.clientHeight; renderer.setPixelRatio(1); renderer.setSize(Math.round(cw*dpr), Math.round(ch*dpr), false);
  W = Math.max(16, Math.round(cw*dpr*q.scale)); H = Math.max(16, Math.round(ch*dpr*q.scale)); LW = Math.max(8, Math.round(W*q.low)); LH = Math.max(8, Math.round(H*q.low));

function segBlocked(ax, az, bx, bz) { const dx = bx-ax, dz = bz-az, L2 = dx*dx + dz*dz; let u = L2 > 0 ? -(ax*dx + az*dz)/L2 : 0; u = Math.max(0, Math.min(1, u)); const cx = ax + u*dx, cz = az + u*dz; return cx*cx + cz*cz < A_T*A_T; }

/* ---------- 每帧渲染 ---------- */
let ping = 0, last = performance.now(), fpsAcc = 0, fpsN = 0, fps = 0, firstFrame = true;
function frame(now) {
  const dt = Math.min(0.1, (now - last)/1000); last = now;
  step(dt);
  fpsAcc += dt; fpsN++; if (fpsAcc > 0.5) { fps = fpsN/fpsAcc; fpsAcc = 0; fpsN = 0; hud(); }
  requestAnimationFrame(frame);
}
function step(dt) {
  if (SPEEDS[S.spd] > 0) { S.hour += dt*SPEEDS[S.spd]/3600; while (S.hour >= 24) { S.hour -= 24; S.day = (S.day + 1) % 360; } syncUI(false); }

  M.blur.uniforms.tSrc.value = bloomB.texture; M.blur.uniforms.uDir.value.set(0, 1.5/bloomA.height); pass(M.blur, bloomA);

function hud() {
  const lt = S.hour, hh = Math.floor(lt), mm = Math.floor((lt - hh)*60);
  const sv = st.sunVis > 0.999 ? '昼' : st.sunVis < 0.001 ? '夜（塔影）' : '日缘入塔 ' + (st.sunVis*100).toFixed(0) + '%';
  $('hud').textContent = `${SITES[S.site][0]}  纬度/地面倾角 ${(st.lat/D2R).toFixed(1)}°  ${(W)}×${H}（远场 ${LW}×${LH}）  ${fps.toFixed(0)} fps\n` +
    `当地 ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}  ${sv}  太阳 仰角 ${st.sunElev.toFixed(1)}° 方位 ${st.sunAz.toFixed(0)}°\n` +
    `月 仰角 ${st.moonElev.toFixed(1)}° 方位 ${st.moonAz.toFixed(0)}° 视径 ${st.moonDiam.toFixed(2)}° ${st.moonLit < 0.01 ? '黑月' : '受照 ' + (st.moonLit*100).toFixed(0) + '%'}\n` +
    `视线 方位 ${S.yaw.toFixed(0)}° 仰角 ${S.pitch.toFixed(0)}°  GPU ${GPU}`;
}
/* ---------- 交互 ---------- */
SITES.forEach((s, i) => { const o = document.createElement('option'); o.value = i; o.textContent = s[0]; $('site').appendChild(o); });
function syncUI(all) {
  $('oDay').textContent = S.day + '（' + (S.day < 180 ? '冬半年' : '夏半年') + '）'; $('oHour').textContent = S.hour.toFixed(2) + ' 时'; $('oSpd').textContent = SPEEDS[S.spd] + '×';
  $('oH').textContent = S.H + ' km'; $('oV').textContent = S.V + ' km'; $('oW').textContent = S.W.toFixed(1) + ' km'; $('oCov').textContent = S.cov.toFixed(2); $('oEv').textContent = S.ev.toFixed(2);
  $('hour').value = S.hour; $('day').value = S.day;
  if (all) { $('site').value = S.site; $('mode').value = S.mode; $('spd').value = S.spd; $('H').value = S.H; $('V').value = S.V; $('W').value = S.W; $('cov').value = S.cov; $('ev').value = S.ev; $('q').value = S.q; $('clouds').checked = S.clouds; $('zuiyu').checked = S.zuiyu; }
}
const bind = (id, key, fn, parse) => $(id).addEventListener('input', () => { S[key] = (parse || parseFloat)($(id).value); if (fn) fn(); syncUI(false); });
bind('day', 'day'); bind('hour', 'hour'); bind('spd', 'spd'); bind('W', 'W'); bind('cov', 'cov'); bind('ev', 'ev');
bind('H', 'H', atmoParams); bind('V', 'V', atmoParams);
$('site').addEventListener('change', () => { S.site = +$('site').value; });
$('mode').addEventListener('change', () => { S.mode = +$('mode').value; });
$('q').addEventListener('change', () => { S.q = +$('q').value; resize(); });
$('clouds').addEventListener('change', () => { S.clouds = $('clouds').checked; });
$('zuiyu').addEventListener('change', () => { S.zuiyu = $('zuiyu').checked; });
document.querySelectorAll('[data-look]').forEach(b => b.addEventListener('click', () => {
  const k = b.dataset.look; const m = {N:[0,5], E:[90,5], S:[180,5], W:[270,5], Z:[S.yaw,89]};
  if (m[k]) { S.yaw = m[k][0]; S.pitch = m[k][1]; return; }
  const d = st.dirs[k]; S.pitch = Math.asin(-d[0])/D2R; S.yaw = ((Math.atan2(-d[2], -d[1])/D2R) + 360) % 360;
}));
let drag = null;
canvas.addEventListener('pointerdown', e => { drag = {x:e.clientX, y:e.clientY}; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => { if (!drag) return; const k = 0.15*S.fov/60; S.yaw = ((S.yaw - (e.clientX - drag.x)*k) % 360 + 360) % 360; S.pitch = Math.max(-89, Math.min(89, S.pitch + (e.clientY - drag.y)*k)); drag = {x:e.clientX, y:e.clientY}; });

canvas.addEventListener('wheel', e => { e.preventDefault(); S.fov = Math.max(5, Math.min(100, S.fov*Math.exp(e.deltaY*0.001))); }, {passive:false});

window.PROTO = {S, st, U, M, renderer, terrMat, setView(o) { Object.assign(S, o); syncUI(true); if ('q' in o) resize(); },
  step(n, dt) { for (let i = 0; i < (n||1); i++) step(dt || 1/30); },
  rt() { return {tauRT, msRT, probeRT, shRT, farRT, nearRT, hdrRT, expRT, meterRT, ping}; },

atmoParams(); resize(); syncUI(true); requestAnimationFrame(frame);
