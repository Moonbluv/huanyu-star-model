<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>方案A 着色器试验台</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#ddd;font:12px/1.4 system-ui,"Microsoft YaHei",sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:8px;top:8px;background:rgba(0,0,0,.55);padding:6px 8px;border-radius:4px;white-space:pre;pointer-events:none;max-width:60vw}
</style></head><body>
<canvas id="c"></canvas><div id="hud"></div>
<script id="glsl-common" type="x-shader">/*COMMON*/</script>
<script id="glsl-main" type="x-shader">/*MAIN*/</script>
<script id="glsl-probe" type="x-shader">/*PROBE*/</script>
<script id="glsl-mslut" type="x-shader">/*MSLUT*/</script>
<script id="glsl-post" type="x-shader">/*POST*/</script>
<script>
'use strict';
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const $ = id => document.getElementById(id);
const src = id => $(id).textContent;
const cv = $('c');
const gl = cv.getContext('webgl2', { antialias: false, alpha: false, depth: false, preserveDrawingBuffer: true });
const LOG = [];
function log(s) { LOG.push(s); console.log(s); }
if (!gl) { document.body.innerHTML = '<p style="color:#f88;padding:20px">没有 WebGL2</p>'; throw new Error('no webgl2'); }
const extCBF = gl.getExtension('EXT_color_buffer_float');
gl.getExtension('OES_texture_float_linear');
const extPar = gl.getExtension('KHR_parallel_shader_compile');

// ---------------- 参数 ----------------
const P = {
  R: 6371, a: 600, gEq: 1.4, gLight: 0.75, gHeavy: 1.2, limboKm: 330,
  Y: 360, M: 32, rs: 640, rm: 6371 / 2, A: 6371 / 2, rhoS: 20, rhoM: 100,
  sunLux: 128000, sunRef: 5731,
  HR: 40, HM: 6, V: 200, mieG: 0.76, atmo: 1,
  mode: 1, W: 1.5, Hc: 99, cliff: 0.07, wig: 0.35, cliffJit: 0.07, veil: 0, disp: 1.0, abyssDepth: 30, abyssHalf: 220,
  cloud: 1, cloudBase: 1.5, cloudTop: 6.5, cover: 0.42, cloudSigma: 22, ruiOvercast: 1.0, ruiRad: 900, rain: 0.03, wet: 0.7,
  towerAlb: 0.0, moonAlb: 0.12,
  s: 6670, lon: -4, eye: 0.0017, yaw: 180, pitch: 10, fov: 70,
  t: 3 * 360 + 295 + 0.5 + 4 / 360, EV: 0, lock: 0, lockEV: 12, purkinje: 1, adaptMin: 0.003, adaptMax: 1e5,
  scale: 0.5, quality: 'mid', frames: 0, bloom: 0.02
};
const QUALITY = {
  low:  { Q_ATM_NEAR: 8,  Q_ATM_FAR: 6,  Q_TER_STEPS: 56,  Q_NEAR_KM: '40.0',  Q_SHADOW_STEPS: 10, Q_CLOUD_STEPS: 16, Q_CLOUD_LIGHT: 2 },
  mid:  { Q_ATM_NEAR: 14, Q_ATM_FAR: 10, Q_TER_STEPS: 96,  Q_NEAR_KM: '80.0',  Q_SHADOW_STEPS: 20, Q_CLOUD_STEPS: 32, Q_CLOUD_LIGHT: 4 },
  high: { Q_ATM_NEAR: 24, Q_ATM_FAR: 16, Q_TER_STEPS: 160, Q_NEAR_KM: '150.0', Q_SHADOW_STEPS: 32, Q_CLOUD_STEPS: 64, Q_CLOUD_LIGHT: 6 }
};

// ---------------- 天体（方案乙：日月对称双螺旋） ----------------
function sunAt(t) { const lam = Math.PI + TAU * t; return [P.rs * Math.cos(lam), P.A * Math.sin(TAU * t / P.Y), P.rs * Math.sin(lam)]; }
function moonAt(t) { const lam = TAU * t * (1 - 1 / P.M); return [P.rm * Math.cos(lam), -P.A * Math.sin(TAU * t / P.Y), P.rm * Math.sin(lam)]; }

// ---------------- 向量 ----------------
const v3 = { sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s], dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  len: a => Math.hypot(a[0], a[1], a[2]), norm: a => { const l = Math.hypot(a[0], a[1], a[2]); return [a[0] / l, a[1] / l, a[2] / l]; } };
const smooth = (a, b, x) => { const u = Math.min(1, Math.max(0, (x - a) / (b - a))); return u * u * (3 - 2 * u); };

// CPU 版遮挡（与着色器同式）
function bodyVisTower(X, S, rho) {
  const px = X[0], pz = X[2], rp2 = px * px + pz * pz, a2 = P.a * P.a;
  if (rp2 <= a2) return 0;
  const rp = Math.sqrt(rp2), qx = S[0] - px, qz = S[2] - pz, Lh = Math.hypot(qx, qz);
  if (Lh < 1e-3) return 1;
  const cx = -px / rp, cz = -pz / rp, cosA = (qx * cx + qz * cz) / Lh;
  if (cosA <= 0) return 1;
  const sinA = Math.abs(cx * qz - cz * qx) / Lh, sd = P.a / rp, cd = Math.sqrt(Math.max(0, 1 - sd * sd));
  const u = Lh * (sinA * cd - cosA * sd) / rho;
  if (u >= 1) return 1;
  if (sinA < sd) { const tHit = rp * cosA - Math.sqrt(Math.max(a2 - rp2 * sinA * sinA, 0)); if (Lh < tHit) return 1; }
  else if (Lh < rp * cd) return 1;
  if (u <= -1) return 0;
  return 0.5 + (u * Math.sqrt(1 - u * u) + Math.asin(u)) / Math.PI;
}

// ---------------- 程序噪声 ----------------
function hash2(i, j, s) { let h = (i * 374761393 + j * 668265263 + s * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; h = h ^ (h >>> 16); return (h >>> 0) / 4294967296; }
function hash3(i, j, k, s) { let h = (i * 374761393 + j * 668265263 + k * 1440662683 + s * 2654435761) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; h = h ^ (h >>> 16); return (h >>> 0) / 4294967296; }
const fade5 = t => t * t * t * (t * (t * 6 - 15) + 10);
function perlin2(x, y, per, seed) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const g = (i, j) => { const a = hash2(((i % per) + per) % per, ((j % per) + per) % per, seed) * TAU; return [Math.cos(a), Math.sin(a)]; };
  const d = (i, j, dx, dy) => { const gg = g(i, j); return gg[0] * dx + gg[1] * dy; };
  const u = fade5(xf), v = fade5(yf);
  const n00 = d(xi, yi, xf, yf), n10 = d(xi + 1, yi, xf - 1, yf), n01 = d(xi, yi + 1, xf, yf - 1), n11 = d(xi + 1, yi + 1, xf - 1, yf - 1);
  return (n00 + u * (n10 - n00) + v * (n01 - n00) + u * v * (n00 - n10 - n01 + n11)) * 1.414;
}
function makeHeight(N) {
  const H = new Float32Array(N * N), M = new Float32Array(N * N);
  const F = 32;  // 32 个特征/平铺
  let mn = 1e9, mx = -1e9;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const x = i / N, y = j / N;
    let f = 0, a = 1, per = F, ridge = 0;
    for (let o = 0; o < 4; o++) { const n = perlin2(x * per, y * per, per, 11 + o); f += a * n; ridge += a * (1 - Math.abs(n)); a *= 0.5; per *= 2; }
    const h = 0.55 * f + 0.45 * (ridge - 0.9);
    H[j * N + i] = h; mn = Math.min(mn, h); mx = Math.max(mx, h);
    let m = 0; a = 1; per = 16;
    for (let o = 0; o < 3; o++) { m += a * perlin2(x * per, y * per, per, 77 + o); a *= 0.5; per *= 2; }
    M[j * N + i] = 0.5 + 0.5 * m;
  }
  const out = new Float32Array(N * N * 4);
  for (let k = 0; k < N * N; k++) H[k] = 2 * (H[k] - mn) / (mx - mn) - 1;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const k = j * N + i, ip = j * N + (i + 1) % N, im = j * N + (i + N - 1) % N, jp = ((j + 1) % N) * N + i, jm = ((j + N - 1) % N) * N + i;
    out[4 * k] = H[k]; out[4 * k + 1] = (H[ip] - H[im]) * 0.5 * N; out[4 * k + 2] = (H[jp] - H[jm]) * 0.5 * N; out[4 * k + 3] = Math.min(1, Math.max(0, M[k]));
  }
  return { N, data: out, H };
}
function sampleH(T, u, v) {  // 与 GL LINEAR+REPEAT 一致
  const N = T.N; let x = u * N - 0.5, y = v * N - 0.5;
  const x0 = Math.floor(x), y0 = Math.floor(y), fx = x - x0, fy = y - y0;
  const g = (i, j) => T.H[(((j % N) + N) % N) * N + (((i % N) + N) % N)];
  return (g(x0, y0) * (1 - fx) + g(x0 + 1, y0) * fx) * (1 - fy) + (g(x0, y0 + 1) * (1 - fx) + g(x0 + 1, y0 + 1) * fx) * fy;
}
function make3D(N) {
  const out = new Uint8Array(N * N * N * 4);
  const worley = (x, y, z, cells, seed) => {
    const xi = Math.floor(x * cells), yi = Math.floor(y * cells), zi = Math.floor(z * cells);
    let best = 9;
    for (let dz = -1; dz <= 1; dz++) for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const cx = xi + dx, cy = yi + dy, cz = zi + dz;
      const wx = ((cx % cells) + cells) % cells, wy = ((cy % cells) + cells) % cells, wz = ((cz % cells) + cells) % cells;
      const px = (cx + hash3(wx, wy, wz, seed)) / cells, py = (cy + hash3(wx, wy, wz, seed + 1)) / cells, pz = (cz + hash3(wx, wy, wz, seed + 2)) / cells;
      const d = Math.hypot(px - x, py - y, pz - z) * cells; if (d < best) best = d;
    }
    return Math.max(0, 1 - best);
  };
  const perlin3 = (x, y, z, per, seed) => {
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z), xf = x - xi, yf = y - yi, zf = z - zi;
    const gr = (i, j, k) => { i = ((i % per) + per) % per; j = ((j % per) + per) % per; k = ((k % per) + per) % per;
      const th = hash3(i, j, k, seed) * TAU, zz = hash3(i, j, k, seed + 9) * 2 - 1, r = Math.sqrt(1 - zz * zz); return [r * Math.cos(th), r * Math.sin(th), zz]; };
    const dd = (i, j, k, dx, dy, dz) => { const g = gr(i, j, k); return g[0] * dx + g[1] * dy + g[2] * dz; };
    const u = fade5(xf), v = fade5(yf), w = fade5(zf);
    const L = (a, b, t) => a + (b - a) * t;
    return L(L(L(dd(xi, yi, zi, xf, yf, zf), dd(xi + 1, yi, zi, xf - 1, yf, zf), u), L(dd(xi, yi + 1, zi, xf, yf - 1, zf), dd(xi + 1, yi + 1, zi, xf - 1, yf - 1, zf), u), v),
             L(L(dd(xi, yi, zi + 1, xf, yf, zf - 1), dd(xi + 1, yi, zi + 1, xf - 1, yf, zf - 1), u), L(dd(xi, yi + 1, zi + 1, xf, yf - 1, zf - 1), dd(xi + 1, yi + 1, zi + 1, xf - 1, yf - 1, zf - 1), u), v), w);
  };
  for (let k = 0; k < N; k++) for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const x = (i + 0.5) / N, y = (j + 0.5) / N, z = (k + 0.5) / N;
    let p = 0, a = 1, per = 4, an = 0;
    for (let o = 0; o < 3; o++) { p += a * perlin3(x * per, y * per, z * per, per, 3 + o); an += a; a *= 0.5; per *= 2; }
    p = 0.5 + 0.5 * p / an * 1.6;
    const w1 = worley(x, y, z, 4, 101), w2 = worley(x, y, z, 8, 202), w3 = worley(x, y, z, 16, 303);
    const pw = Math.min(1, Math.max(0, p * 0.65 + (w1 * 0.625 + w2 * 0.25 + w3 * 0.125) * 0.45 - 0.05));
    const o4 = 4 * (k * N * N + j * N + i);
    out[o4] = pw * 255; out[o4 + 1] = w1 * 255; out[o4 + 2] = w2 * 255; out[o4 + 3] = w3 * 255;
  }
  return out;
}

// ---------------- GL 小工具 ----------------
const VS = '#version 300 es\nvoid main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);gl_Position=vec4(p*2.0-1.0,0.0,1.0);}';
function compile(type, s, name) {
  const sh = gl.createShader(type); gl.shaderSource(sh, s); gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) { const e = gl.getShaderInfoLog(sh); log('编译失败 ' + name + ':\n' + e); throw new Error(name + ': ' + e); }
  return sh;
}
function program(fs, name) {
  const p = gl.createProgram(); gl.attachShader(p, compile(gl.VERTEX_SHADER, VS, 'vs')); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs, name)); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { const e = gl.getProgramInfoLog(p); log('链接失败 ' + name + ': ' + e); throw new Error(e); }
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); const nm = info.name.replace(/\[0\]$/, ''); u[nm] = gl.getUniformLocation(p, info.name); }
  return { p, u, name };
}
function defs(q) { return Object.entries(q).map(([k, v]) => '#define ' + k + ' ' + v).join('\n') + '\n'; }
function tex2D(w, h, internal, format, type, data, filter, wrap) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, format, type, data || null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap);
  return t;
}
function rt(w, h, filter) {
  const t = tex2D(w, h, gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT, null, filter || gl.LINEAR, gl.CLAMP_TO_EDGE);
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  return { t, f, w, h };
}

// ---------------- 资源 ----------------
let T0 = performance.now();
const HM = makeHeight(512);
const texH = tex2D(512, 512, gl.RGBA16F, gl.RGBA, gl.FLOAT, HM.data, gl.LINEAR, gl.REPEAT);
log('高度图 ' + (performance.now() - T0).toFixed(0) + ' ms'); T0 = performance.now();
const N3 = 64, n3data = make3D(N3);
const tex3 = gl.createTexture(); gl.bindTexture(gl.TEXTURE_3D, tex3);
gl.texImage3D(gl.TEXTURE_3D, 0, gl.RGBA8, N3, N3, N3, 0, gl.RGBA, gl.UNSIGNED_BYTE, n3data);
gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
[gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T, gl.TEXTURE_WRAP_R].forEach(w => gl.texParameteri(gl.TEXTURE_3D, w, gl.REPEAT));
log('三维噪声 ' + (performance.now() - T0).toFixed(0) + ' ms');

const rtMS = rt(32, 32), rtProbe = rt(32, 16, gl.NEAREST), rtSH = rt(9, 1, gl.NEAREST);
const rtExp = [rt(1, 1, gl.NEAREST), rt(1, 1, gl.NEAREST)];
const texBlack = tex2D(1, 1, gl.RGBA16F, gl.RGBA, gl.FLOAT, new Float32Array(4), gl.NEAREST, gl.CLAMP_TO_EDGE);
let rtHDR = null;
let progs = {};
function buildPrograms() {
  const q = defs(QUALITY[P.quality]);
  const head = '#version 300 es\n' + q;
  const T = performance.now();
  progs.main = program(head + src('glsl-common') + '\n' + src('glsl-main'), 'main');
  progs.probe = program(head + src('glsl-common') + '\n' + src('glsl-probe'), 'probe');
  progs.ms = program(head + src('glsl-common') + '\n' + src('glsl-mslut'), 'mslut');
  progs.sh = program('#version 300 es\n#define PASS_SH\n' + src('glsl-post'), 'sh');
  progs.expo = program('#version 300 es\n#define PASS_EXPO\n' + src('glsl-post'), 'expo');
  progs.fin = program('#version 300 es\n#define PASS_FINAL\n' + src('glsl-post'), 'final');
  progs.taa = program('#version 300 es\n#define PASS_TAA\n' + src('glsl-post'), 'taa');
  progs.bd = program('#version 300 es\n#define PASS_BLOOM_DOWN\n' + src('glsl-post'), 'bd');
  progs.bu = program('#version 300 es\n#define PASS_BLOOM_UP\n' + src('glsl-post'), 'bu');
  log('编译 ' + (performance.now() - T).toFixed(0) + ' ms（' + P.quality + '）');
}

// ---------------- 场景量 ----------------
const LAYER_L = [6.0, 1.1, 0.2, 0.035, 0.006], LAYER_A = [0.32, 0.085, 0.018, 0.0032, 0.0007], TF = 32;
function trench(y) { return P.abyssDepth * (1 - smooth(P.abyssHalf * 0.55, P.abyssHalf, Math.abs(y))); }
function sawS(f) { return (f - 0.5) - smooth(1 - P.cliff, 1, f); }
const fract = x => x - Math.floor(x);
const fr = Math.fround;
function scene() {
  const R = P.R, psi = P.s / R, lam = P.lon * D2R;
  const ySph = -R * Math.cos(psi);
  const rS = R * Math.sin(psi);
  const g = P.gEq * rS / R;
  const zw = [1 - smooth(P.gLight - 0.04, P.gLight + 0.04, g), 0, smooth(P.gHeavy - 0.04, P.gHeavy + 0.04, g), 0];
  zw[1] = Math.max(0, 1 - zw[0] - zw[2]);
  const ruiDir = (() => { const ps = 6670 / R, la = -4 * D2R; return [Math.sin(ps) * Math.cos(la), -Math.cos(ps), Math.sin(ps) * Math.sin(la)]; })();
  const ruiRad = P.ruiRad / R;
  const dirP = [Math.sin(psi) * Math.cos(lam), -Math.cos(psi), Math.sin(psi) * Math.sin(lam)];
  const cdR = v3.dot(dirP, ruiDir);
  zw[3] = smooth(Math.cos(ruiRad), Math.cos(ruiRad * 0.75), cdR);
  const limboW = 1 - smooth(P.limboKm * 0.8, P.limboKm, Math.abs(ySph));
  let zoneAmp = (zw[0] * 1.6 + zw[1] * 0.7 + zw[2] * 1.0);
  zoneAmp = zoneAmp * (1 - zw[3]) + 1.25 * zw[3];
  zoneAmp = zoneAmp * (1 - limboW) + 0.4 * limboW;
  const amp = zoneAmp * P.disp;
  // 噪声原点（相机全球地表坐标，双精度取模）
  const cg = [-rS * lam, -P.s];
  const org = [];
  for (let k = 0; k < 5; k++) {
    const an = k * 1.31, c = Math.cos(an), s = Math.sin(an), sc = 1 / (LAYER_L[k] * TF);
    org.push(fract((c * cg[0] - s * cg[1]) * sc), fract((s * cg[0] + c * cg[1]) * sc));
  }
  let D = 0;
  for (let k = 0; k < 5; k++) D += LAYER_A[k] * amp * sampleH(HM, org[2 * k], org[2 * k + 1]);
  // 阶地：有符号崖高（不超过踏面宽 × tan 纬度，赤道附近自然消失）
  const tanLat = Math.abs(ySph) / Math.max(rS, 1);
  const HcS = (ySph < 0 ? 1 : -1) * Math.min(P.Hc, P.W * tanLat);
  const wigS = 1 / (10 * P.W * TF);
  const wigOrg = [fract(cg[0] * wigS), fract(cg[1] * wigS)];
  const w0 = sampleH(HM, wigOrg[0], wigOrg[1]);
  const b0 = sampleH(HM, org[2], org[3]);
  const camF = fract(ySph / P.W + P.wig * w0 + P.cliffJit * b0);
  let Pc;
  if (P.mode === 1) {
    const y = ySph;
    const rb = Math.sqrt(R * R - y * y) - HcS * sawS(camF) + trench(y);
    const r = rb - (D + P.eye);
    Pc = [r * Math.cos(lam), y, r * Math.sin(lam)];
  } else {
    const rho = R + trench(ySph) - (D + P.eye);
    Pc = v3.mul(dirP, rho);
  }
  Pc = Pc.map(fr);
  const rho = v3.len(Pc), r0 = Math.hypot(Pc[0], Pc[2]), yP = Pc[1];
  const rsP = Math.sqrt(R * R - yP * yP);
  const altS = R + trench(yP) - rho;
  const altT = rsP - HcS * sawS(camF) + trench(yP) - r0;
  const U = [-Pc[0] / r0, 0, -Pc[2] / r0], Nn = [0, -1, 0], E = v3.cross(Nn, U);
  const yaw = P.yaw * D2R, pit = Math.min(89.5, Math.max(-89.5, P.pitch)) * D2R;
  const fwd = v3.add(v3.mul(v3.add(v3.mul(Nn, Math.cos(yaw)), v3.mul(E, Math.sin(yaw))), Math.cos(pit)), v3.mul(U, Math.sin(pit)));
  const right = v3.norm(v3.cross(fwd, U)), up = v3.cross(right, fwd);
  // 日月
  const S = sunAt(P.t), Mo = moonAt(P.t);

let expIdx = 0, lastT = performance.now(), msDirty = true;

const vao = gl.createVertexArray();

function readExpo() { gl.bindFramebuffer(gl.FRAMEBUFFER, rtExp[expIdx].f); const b = new Float32Array(4); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.FLOAT, b); return b; }

// ---------------- 交互 ----------------
let drag = null;

function hud() {

// 测试接口

// 测量辅助：太阳/月亮方位、水平面天空照度（由 SH 算）、若干像素亮度
